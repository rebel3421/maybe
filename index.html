<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Battle</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
        user-select: none;
    }

    #game {
        position: relative;
        width: 900px;
        height: 650px;
        margin: 20px auto;
        background: linear-gradient(#292929, #111);
        border: 4px solid #555;
        overflow: hidden;
    }

    /* Health bar */
    #healthBar {
        position: absolute;
        top: 20px;
        left: 150px;
        width: 600px;
        height: 25px;
        background: #222;
        border: 3px solid white;
        border-radius: 15px;
        overflow: hidden;
        z-index: 10;
    }

    #health {
        width: 50%;
        height: 100%;
        background: #55e85c;
        transition: width 0.15s;
    }

    #player {
        position: absolute;
        bottom: 40px;
        right: 90px;
        font-size: 100px;
    }

    #opponent {
        position: absolute;
        bottom: 40px;
        left: 90px;
        font-size: 100px;
    }

    /* Note area */
    #notes {
        position: absolute;
        top: 100px;
        left: 250px;
        width: 400px;
        height: 480px;
    }

    .lane {
        position: absolute;
        top: 0;
        width: 100px;
        height: 100%;
        background: rgba(255,255,255,0.04);
        border-left: 2px solid #444;
        border-right: 2px solid #444;
    }

    .lane:nth-child(1) { left: 0; }
    .lane:nth-child(2) { left: 100px; }
    .lane:nth-child(3) { left: 200px; }
    .lane:nth-child(4) { left: 300px; }

    /* Receptors */
    .receptor {
        position: absolute;
        bottom: 20px;
        width: 80px;
        height: 80px;
        border: 4px solid white;
        border-radius: 12px;
        text-align: center;
        font-size: 45px;
        line-height: 70px;
        opacity: 0.8;
    }

    #r0 { left: 10px; }
    #r1 { left: 110px; }
    #r2 { left: 210px; }
    #r3 { left: 310px; }

    .note {
        position: absolute;
        width: 70px;
        height: 70px;
        border-radius: 12px;
        text-align: center;
        line-height: 62px;
        font-size: 40px;
        font-weight: bold;
        z-index: 5;
    }

    .note.left  { background: #e94bff; }
    .note.down  { background: #42b5ff; }
    .note.up    { background: #55e85c; }
    .note.right { background: #ff5555; }

    #score {
        position: absolute;
        top: 65px;
        width: 100%;
        text-align: center;
        font-size: 24px;
        z-index: 10;
    }

    #combo {
        position: absolute;
        top: 95px;
        width: 100%;
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        z-index: 10;
    }

    #message {
        position: absolute;
        top: 300px;
        width: 100%;
        text-align: center;
        font-size: 45px;
        font-weight: bold;
        pointer-events: none;
        z-index: 20;
    }

    #start {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.9);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    #start button {
        padding: 15px 35px;
        font-size: 25px;
        cursor: pointer;
        border: none;
        border-radius: 10px;
    }

    .hit {
        transform: scale(1.15);
        opacity: 1;
    }
</style>
</head>

<body>

<div id="game">

    <div id="start">
        <h1>RHYTHM BATTLE</h1>
        <p>Press the arrows when the notes reach the receptors!</p>
        <button onclick="startGame()">START</button>
    </div>

    <div id="healthBar">
        <div id="health"></div>
    </div>

    <div id="score">Score: 0</div>
    <div id="combo">Combo: 0</div>

    <div id="opponent">👾</div>
    <div id="player">😎</div>

    <div id="notes">

        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

        <div class="receptor" id="r0">←</div>
        <div class="receptor" id="r1">↓</div>
        <div class="receptor" id="r2">↑</div>
        <div class="receptor" id="r3">→</div>

    </div>

    <div id="message"></div>
</div>

<script>

const notesContainer = document.getElementById("notes");
const healthBar = document.getElementById("health");
const scoreText = document.getElementById("score");
const comboText = document.getElementById("combo");
const message = document.getElementById("message");

const arrows = ["←", "↓", "↑", "→"];
const keys = ["ArrowLeft", "ArrowDown", "ArrowUp", "ArrowRight"];

let notes = [];
let score = 0;
let combo = 0;
let health = 50;
let gameRunning = false;
let startTime = 0;

/*
    FNF-style chart.

    time = milliseconds after song starts
    lane:
    0 = left
    1 = down
    2 = up
    3 = right
*/

const chart = [

    // Intro
    [1000, 0],
    [1250, 1],
    [1500, 2],
    [1750, 3],

    // First section
    [2000, 0],
    [2150, 2],
    [2300, 1],
    [2450, 3],

    [2650, 0],
    [2650, 2],

    [2850, 1],
    [3000, 3],

    [3150, 2],
    [3300, 0],

    // Fast section
    [3500, 1],
    [3650, 2],
    [3800, 3],
    [3950, 0],

    [4150, 0],
    [4150, 3],

    [4350, 1],
    [4500, 2],
    [4650, 3],
    [4800, 1],

    // More difficult pattern
    [5000, 0],
    [5150, 1],
    [5300, 2],
    [5450, 3],

    [5600, 0],
    [5600, 1],

    [5800, 2],
    [5950, 3],

    [6100, 1],
    [6250, 0],
    [6400, 2],
    [6550, 3],

    // Double notes
    [6750, 0],
    [6750, 2],

    [6950, 1],
    [6950, 3],

    [7150, 0],
    [7300, 2],
    [7450, 1],
    [7600, 3],

    // Ending
    [7800, 0],
    [7950, 1],
    [8100, 2],
    [8250, 3],

    [8450, 0],
    [8450, 3],

    [8650, 1],
    [8800, 2],
    [8950, 0],
    [9100, 3]
];

function startGame() {

    document.getElementById("start").style.display = "none";

    score = 0;
    combo = 0;
    health = 50;

    notes.forEach(note => note.element.remove());
    notes = [];

    scoreText.textContent = "Score: 0";
    comboText.textContent = "Combo: 0";
    healthBar.style.width = "50%";

    startTime = performance.now();
    gameRunning = true;

    requestAnimationFrame(gameLoop);
}

function spawnNote(lane) {

    const note = document.createElement("div");

    note.classList.add("note");

    const classes = [
        "left",
        "down",
        "up",
        "right"
    ];

    note.classList.add(classes[lane]);

    note.textContent = arrows[lane];

    note.style.left = (lane * 100 + 15) + "px";
    note.style.top = "-80px";

    notesContainer.appendChild(note);

    notes.push({
        element: note,
        lane: lane,
        y: -80,
        hit: false
    });
}

function gameLoop(now) {

    if (!gameRunning) return;

    const elapsed = now - startTime;

    /*
        Spawn notes based on the chart.
    */

    chart.forEach((data, index) => {

        if (!notes[index] && elapsed >= data[0] - 1000) {

            spawnNote(data[1]);

        }

    });

    /*
        Move notes downward.
    */

    notes.forEach((note, index) => {

        if (note.hit) return;

        /*
            Increase this value for a faster game.
        */

        note.y += 8;

        note.element.style.top = note.y + "px";

        /*
            If a note passes the receptors,
            count it as a miss.
        */

        if (note.y > 450) {

            missNote(note);

        }

    });

    /*
        Keep the game going until the chart finishes.
    */

    if (elapsed < 12000 && health > 0) {

        requestAnimationFrame(gameLoop);

    } else {

        endGame();

    }
}

function hitNote(lane) {

    let closest = null;
    let closestDistance = Infinity;

    notes.forEach(note => {

        if (note.hit || note.lane !== lane)
            return;

        const distance = Math.abs(note.y - 390);

        if (distance < closestDistance) {

            closestDistance = distance;
            closest = note;

        }

    });

    /*
        Hit window.
    */

    if (closest && closestDistance < 65) {

        closest.hit = true;
        closest.element.remove();

        combo++;

        /*
            Bigger combo = bigger score.
        */

        score += 100 + combo * 10;

        health = Math.min(100, health + 1);

        scoreText.textContent = "Score: " + score;
        comboText.textContent = "Combo: " + combo;
        healthBar.style.width = health + "%";

        showMessage("GOOD!");

    } else {

        /*
            Pressing the wrong time breaks combo.
        */

        combo = 0;
        comboText.textContent = "Combo: 0";

    }

}

function missNote(note) {

    note.hit = true;
    note.element.remove();

    combo = 0;
    health -= 8;

    comboText.textContent = "Combo: 0";
    healthBar.style.width = Math.max(0, health) + "%";

    showMessage("MISS");

}

function showMessage(text) {

    message.textContent = text;

    setTimeout(() => {

        if (message.textContent === text)
            message.textContent = "";

    }, 250);

}

function endGame() {

    gameRunning = false;

    message.textContent =
        health <= 0
        ? "GAME OVER!"
        : "SONG COMPLETE!";

    setTimeout(() => {

        document.getElementById("start").style.display = "flex";

    }, 1500);
}

/*
    Keyboard controls
*/

document.addEventListener("keydown", event => {

    const lane = keys.indexOf(event.key);

    if (lane !== -1 && gameRunning) {

        event.preventDefault();

        const receptor =
            document.getElementById("r" + lane);

        receptor.classList.add("hit");

        setTimeout(() => {
            receptor.classList.remove("hit");
        }, 100);

        hitNote(lane);

    }

});

</script>

</body>
</html>
