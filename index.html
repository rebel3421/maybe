<!DOCTYPE html>
<html>
<head>
    <title>Simple Rhythm Game</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        #game {
            position: relative;
            width: 500px;
            height: 700px;
            margin: 20px auto;
            background: #222;
            border: 3px solid white;
            overflow: hidden;
        }

        .lane {
            position: absolute;
            top: 0;
            width: 25%;
            height: 100%;
            border-left: 1px solid #444;
        }

        .lane:nth-child(1) { left: 0; }
        .lane:nth-child(2) { left: 25%; }
        .lane:nth-child(3) { left: 50%; }
        .lane:nth-child(4) { left: 75%; }

        .note {
            position: absolute;
            width: 100px;
            height: 25px;
            background: #00e5ff;
            border-radius: 5px;
        }

        #hitLine {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 5px;
            background: white;
        }

        #score {
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h1>Rhythm Game</h1>
    <div id="score">Score: 0 | Combo: 0</div>

    <div id="game">
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

        <div id="hitLine"></div>
    </div>

    <p>Press A S D F when the notes reach the line!</p>

<script>

const game = document.getElementById("game");

let score = 0;
let combo = 0;

const keys = ["a", "s", "d", "f"];

// Create a note
function createNote() {

    const lane = Math.floor(Math.random() * 4);

    const note = document.createElement("div");

    note.classList.add("note");

    note.style.left = (lane * 25) + "%";
    note.style.top = "-30px";

    note.dataset.lane = lane;

    game.appendChild(note);

    let y = -30;

    const fallSpeed = 4;

    function moveNote() {

        y += fallSpeed;

        note.style.top = y + "px";

        if (y > 700) {
            note.remove();
            combo = 0;
            updateScore();
            return;
        }

        requestAnimationFrame(moveNote);
    }

    moveNote();
}

// Create a note every second
setInterval(createNote, 1000);


// Handle keyboard input
document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    if (!keys.includes(key)) {
        return;
    }

    const lane = keys.indexOf(key);

    const notes = document.querySelectorAll(".note");

    for (const note of notes) {

        if (Number(note.dataset.lane) !== lane) {
            continue;
        }

        const noteY = parseFloat(note.style.top);

        // Hit window
        if (noteY > 500 && noteY < 620) {

            note.remove();

            score += 100;
            combo++;

            updateScore();

            break;
        }
    }
});


function updateScore() {

    document.getElementById("score").textContent =
        "Score: " + score + " | Combo: " + combo;

}

</script>

</body>
</html>
